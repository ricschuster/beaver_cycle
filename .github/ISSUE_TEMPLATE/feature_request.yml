name: Feature request
description: Suggest an idea or enhancement
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you would like to see.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves or how it fits the project's goals.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Details, alternatives, or scope thoughts.
