name: Enable auto-merge

# OPT-IN. Move this file (and update-branches.yml) into .github/workflows/ to
# use it; see "Solo-maintainer auto-merge" in README.md for the one-time setup.
#
# Arms GitHub's auto-merge on any PR opened by the repository owner, so a PR
# merges itself as soon as the required checks and branch protection are
# satisfied, with no `gh pr merge --auto` step after opening it. Scoped to
# the owner on purpose: a PR from anyone or anything else (a collaborator,
# Dependabot) still merges by hand. A draft is not armed (GitHub refuses
# it); it is when it is marked ready for review.
#
# It also brings the PR level with main as it arms it. Branch protection wants
# an up-to-date branch, and update-branches.yml only runs on a push to main, so
# a PR armed after main's last push would sit BEHIND until the next one.
# The update goes through the PAT so the PR's check runs on it.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.actor == github.repository_owner && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    env:
      # A step's `if` cannot read a secret or its own env, only the job's.
      HAVE_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          # Auto-merge merges as whoever armed it. Armed with the built-in
          # GITHUB_TOKEN that is github-actions, and GitHub fires no
          # follow-on events for its actions: "Closes #N" would not close the
          # issue, and the push to main would not start other workflows or
          # update-branches.yml. AUTO_MERGE_TOKEN (the fine-grained PAT
          # update-branches.yml uses) makes the merge the owner's.
          # Falls back to GITHUB_TOKEN if the secret is ever removed.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Bring it level with main
        # Only with the PAT: an update pushed with GITHUB_TOKEN starts no
        # workflows, which would leave the PR with no check on its new head and
        # stuck for good. Already level is not an error worth failing for.
        if: env.HAVE_PAT == 'true'
        run: gh pr update-branch "${{ github.event.pull_request.number }}" || echo "already level with main"
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
