<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text review</title>
    <style>
      body { margin: 0; padding: 12px 12px 80px; background: #222; color: #eee; font: 15px sans-serif; max-width: 1100px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 22px 0 6px; color: #9cd; position: sticky; top: 0; background: #222; padding: 4px 0; }
      p { margin: 4px 0; color: #bbb; }
      .bar { position: sticky; top: 0; z-index: 2; background: #222; padding: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid #444; }
      button, select, input[type=search] { font: inherit; padding: 6px 12px; border: 1px solid #555; border-radius: 6px; background: #333; color: #eee; min-height: 40px; }
      input[type=search] { min-width: 12rem; }
      .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid #333; align-items: start; }
      .key { grid-column: 1 / -1; font: 11px monospace; color: #888; }
      .en { white-space: pre-wrap; line-height: 1.4; }
      .en div + div, .de textarea + textarea { margin-top: 6px; }
      mark { background: #5a4a10; color: #ffd866; border-radius: 3px; padding: 0 2px; }
      textarea { width: 100%; box-sizing: border-box; font: inherit; background: #2c2c2c; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 6px; min-height: 2.6em; resize: vertical; }
      textarea.missing { border-color: #a55; }
      .ok { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: #aaa; }
      .ok input { width: 22px; height: 22px; }
      .changed { color: #e9b44c; font-size: 12px; }
      @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>Text review</h1>
    <p>Every text of the game (<code>src/i18n/en/*.ts</code>) with the German beside it. Edit the German, tick <b>Reviewed</b> when it is right. Work is kept in this browser; <b>Export</b> downloads <code>de.ts</code> and <code>reviewed.de.json</code> to put into <code>src/i18n/</code>. Words in <mark>{braces}</mark> are filled in by the game: keep them as they are.</p>
    <div class="bar">
      <span id="count"></span>
      <select id="filter" aria-label="Show">
        <option value="all">All</option>
        <option value="todo">Not reviewed</option>
        <option value="changed">English changed since review</option>
        <option value="missing">No German yet</option>
      </select>
      <input id="search" type="search" placeholder="Search English or German" />
      <button id="export-de" type="button">Export de.ts</button>
      <button id="export-reviewed" type="button">Export reviewed.de.json</button>
      <button id="import" type="button">Import work…</button>
      <input id="import-file" type="file" accept=".json" hidden />
    </div>
    <div id="list"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
